Catthode:
  modes:
    dark: {}

  # Catthode palette
  catthode-bg: "#000000"
  catthode-surface: "#141414"
  catthode-selection: "#2d2d2d"
  catthode-border: "#636363"
  catthode-muted: "#b3b3b3"
  catthode-disabled: "#757575"
  catthode-fg: "#ffffff"
  catthode-red: "#ff6b6b"
  catthode-green: "#b9d665"
  catthode-gold: "#ffb86c"
  catthode-amber: "#ff9e3b"
  catthode-clay: "#f08d49"
  catthode-blue: "#9cd9e6"
  catthode-magenta: "#eba4be"
  catthode-cyan: "#aee6d6"
  catthode-pale: "#fae2c8"

  # Home Assistant semantic colors
  primary-color: "var(--catthode-amber)"
  accent-color: "var(--catthode-blue)"
  dark-primary-color: "var(--catthode-clay)"
  light-primary-color: "var(--catthode-gold)"
  primary-background-color: "var(--catthode-bg)"
  secondary-background-color: "var(--catthode-surface)"
  divider-color: "var(--catthode-selection)"
  disabled-color: "var(--catthode-disabled)"

  primary-text-color: "var(--catthode-fg)"
  secondary-text-color: "var(--catthode-muted)"
  text-primary-color: "var(--catthode-bg)"
  disabled-text-color: "var(--catthode-disabled)"

  card-background-color: "var(--catthode-surface)"
  ha-card-background: "var(--catthode-surface)"
  ha-card-border-color: "var(--catthode-selection)"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "0 10px 30px rgba(0, 0, 0, 0.45)"
  paper-card-background-color: "var(--catthode-surface)"
  paper-dialog-background-color: "var(--catthode-surface)"
  paper-listbox-background-color: "var(--catthode-surface)"

  sidebar-background-color: "#080808"
  sidebar-text-color: "var(--catthode-muted)"
  sidebar-selected-text-color: "var(--catthode-pale)"
  sidebar-selected-icon-color: "var(--catthode-amber)"
  sidebar-icon-color: "var(--catthode-muted)"

  app-header-background-color: "var(--catthode-bg)"
  app-header-text-color: "var(--catthode-fg)"
  app-header-selection-bar-color: "var(--catthode-amber)"

  state-icon-color: "var(--catthode-muted)"
  state-icon-active-color: "var(--catthode-amber)"
  state-icon-unavailable-color: "var(--catthode-disabled)"
  state-light-active-color: "var(--catthode-gold)"
  state-switch-active-color: "var(--catthode-green)"
  state-climate-heat-color: "var(--catthode-clay)"
  state-climate-cool-color: "var(--catthode-blue)"
  state-alarm_control_panel-armed-color: "var(--catthode-red)"

  success-color: "var(--catthode-green)"
  warning-color: "var(--catthode-gold)"
  error-color: "var(--catthode-red)"
  info-color: "var(--catthode-blue)"

  input-fill-color: "var(--catthode-bg)"
  input-ink-color: "var(--catthode-fg)"
  input-label-ink-color: "var(--catthode-muted)"
  input-idle-line-color: "var(--catthode-border)"
  input-hover-line-color: "var(--catthode-gold)"

  code-editor-background-color: "var(--catthode-bg)"
  codemirror-keyword: "var(--catthode-magenta)"
  codemirror-operator: "var(--catthode-cyan)"
  codemirror-variable: "var(--catthode-fg)"
  codemirror-variable-2: "var(--catthode-blue)"
  codemirror-variable-3: "var(--catthode-pale)"
  codemirror-builtin: "var(--catthode-gold)"
  codemirror-atom: "var(--catthode-clay)"
  codemirror-number: "var(--catthode-clay)"
  codemirror-def: "var(--catthode-green)"
  codemirror-string: "var(--catthode-green)"
  codemirror-comment: "var(--catthode-disabled)"
  codemirror-tag: "var(--catthode-red)"
  codemirror-meta: "var(--catthode-gold)"
