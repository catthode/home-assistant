Catthode:
  modes:
    dark: {}

  # Catthode palette
  catthode-bg: "#000000"
  catthode-surface: "#141414"
  catthode-selection: "#2d2d2d"
  catthode-border: "#636363"
  catthode-muted: "#b3b3b3"
  catthode-disabled: "#757575"
  catthode-fg: "#ffffff"
  catthode-red: "#ff6b6b"
  catthode-green: "#b9d665"
  catthode-gold: "#ffb86c"
  catthode-amber: "#ff9e3b"
  catthode-clay: "#f08d49"
  catthode-blue: "#9cd9e6"
  catthode-magenta: "#eba4be"
  catthode-cyan: "#aee6d6"
  catthode-pale: "#fae2c8"

  # Home Assistant semantic colors
  primary-color: "var(--catthode-amber)"
  accent-color: "var(--catthode-gold)"
  dark-primary-color: "var(--catthode-clay)"
  light-primary-color: "var(--catthode-gold)"
  mdc-theme-primary: "var(--catthode-amber)"
  mdc-theme-secondary: "var(--catthode-gold)"
  mdc-theme-on-primary: "var(--catthode-bg)"
  mdc-theme-on-secondary: "var(--catthode-bg)"
  md-sys-color-primary: "var(--catthode-amber)"
  md-sys-color-secondary: "var(--catthode-gold)"
  md-sys-color-tertiary: "var(--catthode-clay)"
  md-sys-color-primary-container: "var(--catthode-clay)"
  md-sys-color-secondary-container: "var(--catthode-gold)"
  md-sys-color-tertiary-container: "var(--catthode-pale)"
  md-sys-color-on-primary: "var(--catthode-bg)"
  md-sys-color-on-secondary: "var(--catthode-bg)"
  md-sys-color-on-tertiary: "var(--catthode-bg)"
  md-sys-color-on-primary-container: "var(--catthode-fg)"
  md-sys-color-on-secondary-container: "var(--catthode-bg)"
  md-sys-color-on-tertiary-container: "var(--catthode-bg)"
  mdc-theme-background: "var(--catthode-bg)"
  mdc-theme-surface: "var(--catthode-surface)"
  mdc-theme-on-surface: "var(--catthode-fg)"
  mdc-theme-error: "var(--catthode-red)"
  primary-background-color: "var(--catthode-bg)"
  secondary-background-color: "var(--catthode-surface)"
  clear-background-color: "var(--catthode-bg)"
  divider-color: "var(--catthode-selection)"
  outline-color: "var(--catthode-selection)"
  outline-hover-color: "var(--catthode-border)"
  disabled-color: "var(--catthode-disabled)"

  # RGB values used by translucent controls and chips
  rgb-primary-color: "255, 158, 59"
  rgb-accent-color: "255, 184, 108"
  rgb-primary-text-color: "255, 255, 255"
  rgb-secondary-text-color: "179, 179, 179"
  rgb-text-primary-color: "0, 0, 0"
  rgb-card-background-color: "20, 20, 20"
  rgb-warning-color: "255, 184, 108"
  rgb-error-color: "255, 107, 107"
  rgb-success-color: "185, 214, 101"
  rgb-info-color: "240, 141, 73"

  primary-text-color: "var(--catthode-fg)"
  secondary-text-color: "var(--catthode-muted)"
  text-primary-color: "var(--catthode-bg)"
  disabled-text-color: "var(--catthode-disabled)"

  card-background-color: "var(--catthode-surface)"
  ha-card-background: "var(--catthode-surface)"
  ha-card-border-color: "var(--catthode-selection)"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "0 10px 30px rgba(0, 0, 0, 0.45)"
  paper-card-background-color: "var(--catthode-surface)"
  paper-dialog-background-color: "var(--catthode-surface)"
  paper-listbox-background-color: "var(--catthode-surface)"

  sidebar-background-color: "#080808"
  sidebar-text-color: "var(--catthode-muted)"
  sidebar-selected-text-color: "var(--catthode-pale)"
  sidebar-selected-icon-color: "var(--catthode-amber)"
  sidebar-icon-color: "var(--catthode-muted)"

  app-header-background-color: "var(--catthode-bg)"
  app-header-text-color: "var(--catthode-fg)"
  app-header-selection-bar-color: "var(--catthode-amber)"

  state-icon-color: "var(--catthode-muted)"
  state-icon-active-color: "var(--catthode-amber)"
  state-icon-unavailable-color: "var(--catthode-disabled)"
  state-light-active-color: "var(--catthode-gold)"
  state-switch-active-color: "var(--catthode-green)"
  state-active-color: "var(--catthode-amber)"
  state-inactive-color: "var(--catthode-muted)"
  state-on-color: "var(--catthode-green)"
  state-off-color: "var(--catthode-muted)"
  state-unknown-color: "var(--catthode-gold)"
  state-unavailable-color: "var(--catthode-disabled)"
  state-icon-error-color: "var(--catthode-red)"
  state-climate-heat-color: "var(--catthode-clay)"
  state-climate-cool-color: "var(--catthode-pale)"
  state-alarm_control_panel-armed-color: "var(--catthode-red)"

  # Warm weather/state aliases that otherwise fall back to blue hues
  state-weather-exceptional-color: "var(--catthode-red)"
  state-weather-fog-color: "var(--catthode-muted)"
  state-weather-hail-color: "var(--catthode-pale)"
  state-weather-lightning_rainy-color: "var(--catthode-amber)"
  state-weather-lightning-color: "var(--catthode-gold)"
  state-weather-partlycloudy-color: "var(--catthode-pale)"
  state-weather-pouring-color: "var(--catthode-clay)"
  state-weather-rainy-color: "var(--catthode-clay)"
  state-weather-snowy_rainy-color: "var(--catthode-pale)"
  state-weather-snowy-color: "var(--catthode-pale)"
  state-weather-sunny-color: "var(--catthode-gold)"
  state-weather-windy_variant-color: "var(--catthode-green)"
  state-weather-windy-color: "var(--catthode-green)"

  success-color: "var(--catthode-green)"
  warning-color: "var(--catthode-gold)"
  error-color: "var(--catthode-red)"
  info-color: "var(--catthode-clay)"
  scrollbar-thumb-color: "var(--catthode-border)"
  label-badge-grey: "var(--catthode-muted)"

  # Energy cards
  energy-grid-consumption-color: "var(--catthode-amber)"
  energy-grid-return-color: "var(--catthode-clay)"
  energy-solar-color: "var(--catthode-gold)"
  energy-non-fossil-color: "var(--catthode-green)"
  energy-battery-out-color: "var(--catthode-magenta)"
  energy-battery-in-color: "var(--catthode-pale)"
  energy-gas-color: "var(--catthode-red)"
  energy-water-color: "var(--catthode-pale)"

  # Conventional color names used by some cards
  red-color: "var(--catthode-red)"
  pink-color: "var(--catthode-magenta)"
  purple-color: "var(--catthode-clay)"
  deep-purple-color: "var(--catthode-clay)"
  indigo-color: "var(--catthode-amber)"
  blue-color: "var(--catthode-gold)"
  light-blue-color: "var(--catthode-pale)"
  cyan-color: "var(--catthode-pale)"
  teal-color: "var(--catthode-green)"
  green-color: "var(--catthode-green)"
  light-green-color: "var(--catthode-green)"
  lime-color: "var(--catthode-gold)"
  yellow-color: "var(--catthode-gold)"
  amber-color: "var(--catthode-amber)"
  orange-color: "var(--catthode-amber)"
  deep-orange-color: "var(--catthode-clay)"
  brown-color: "var(--catthode-clay)"
  light-grey-color: "var(--catthode-muted)"
  grey-color: "var(--catthode-border)"
  dark-grey-color: "var(--catthode-disabled)"
  blue-grey-color: "var(--catthode-disabled)"
  black-color: "var(--catthode-bg)"
  white-color: "var(--catthode-fg)"

  # Warm graph and history series
  color-1: "var(--catthode-gold)"
  color-2: "var(--catthode-amber)"
  color-3: "var(--catthode-clay)"
  color-4: "var(--catthode-green)"
  color-5: "var(--catthode-red)"
  color-6: "var(--catthode-magenta)"
  color-7: "var(--catthode-pale)"
  color-8: "var(--catthode-gold)"
  color-9: "var(--catthode-amber)"
  color-10: "var(--catthode-clay)"
  color-11: "var(--catthode-green)"
  color-12: "var(--catthode-red)"
  color-13: "var(--catthode-magenta)"
  color-14: "var(--catthode-pale)"
  history-unavailable-color: "transparent"
  history-unknown-color: "var(--catthode-disabled)"

  # Explicit graph aliases take precedence in current Home Assistant
  graph-color-1: "var(--catthode-gold)"
  graph-color-2: "var(--catthode-amber)"
  graph-color-3: "var(--catthode-clay)"
  graph-color-4: "var(--catthode-green)"
  graph-color-5: "var(--catthode-red)"
  graph-color-6: "var(--catthode-magenta)"
  graph-color-7: "var(--catthode-pale)"
  graph-color-8: "var(--catthode-gold)"
  graph-color-9: "var(--catthode-amber)"
  graph-color-10: "var(--catthode-clay)"
  graph-color-11: "var(--catthode-green)"
  graph-color-12: "var(--catthode-red)"
  graph-color-13: "var(--catthode-magenta)"
  graph-color-14: "var(--catthode-pale)"

  input-fill-color: "var(--catthode-bg)"
  input-ink-color: "var(--catthode-fg)"
  input-label-ink-color: "var(--catthode-muted)"
  input-idle-line-color: "var(--catthode-border)"
  input-hover-line-color: "var(--catthode-gold)"
  input-disabled-line-color: "var(--catthode-disabled)"
  input-outlined-idle-border-color: "var(--catthode-border)"
  input-outlined-hover-border-color: "var(--catthode-gold)"
  input-outlined-disabled-border-color: "var(--catthode-disabled)"
  input-disabled-fill-color: "var(--catthode-surface)"
  input-disabled-ink-color: "var(--catthode-disabled)"
  input-dropdown-icon-color: "var(--catthode-muted)"

  switch-unchecked-color: "var(--catthode-border)"
  switch-unchecked-button-color: "var(--catthode-muted)"
  switch-unchecked-track-color: "var(--catthode-border)"
  text-accent-color: "var(--catthode-gold)"
  md-slider-inactive-track-color: "var(--catthode-border)"

  code-editor-background-color: "var(--catthode-bg)"
  codemirror-keyword: "var(--catthode-magenta)"
  codemirror-operator: "var(--catthode-gold)"
  codemirror-variable: "var(--catthode-fg)"
  codemirror-variable-2: "var(--catthode-pale)"
  codemirror-variable-3: "var(--catthode-pale)"
  codemirror-builtin: "var(--catthode-gold)"
  codemirror-atom: "var(--catthode-clay)"
  codemirror-number: "var(--catthode-clay)"
  codemirror-def: "var(--catthode-green)"
  codemirror-string: "var(--catthode-green)"
  codemirror-string-2: "var(--catthode-green)"
  codemirror-comment: "var(--catthode-disabled)"
  codemirror-tag: "var(--catthode-red)"
  codemirror-meta: "var(--catthode-gold)"
  codemirror-attribute: "var(--catthode-gold)"
  codemirror-property: "var(--catthode-blue)"
  codemirror-qualifier: "var(--catthode-clay)"
  codemirror-type: "var(--catthode-gold)"

  # Current Home Assistant header, ripple, and progress aliases
  app-header-edit-background-color: "var(--catthode-surface)"
  app-header-edit-text-color: "var(--catthode-fg)"
  mdc-ripple-color: "var(--catthode-muted)"
  mdc-linear-progress-buffer-color: "var(--catthode-selection)"
